[pytest]
testpaths = tests
addopts = -q --import-mode=importlib
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
# Честный замер покрытия (порог — в .coveragerc): export COVERAGE_PROCESS_START="$(pwd -W)/.coveragerc" COVERAGE_FILE="$(pwd -W)/.coverage" PYTHONPATH="$(pwd -W)" && .venv/Scripts/python.exe -m coverage run --parallel-mode -m pytest && .venv/Scripts/python.exe -m coverage combine && .venv/Scripts/python.exe -m coverage report -m
