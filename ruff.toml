# Линтер разработки: не рантайм-зависимость, в CI не блокирует (advisory).
#
# Набор правил сознательно узкий: E4/E7/E9 — ошибки разбора и импортов, F — pyflakes
# (неиспользуемые имена, забытый импорт, дубликаты). Стилистику и длину строк не
# трогаем: в проекте русские комментарии и длинные строки в сообщениях, а спорить о
# переносах дороже, чем читать их как есть.
target-version = "py311"
line-length = 120
exclude = [".git", ".venv", ".pipeline", ".hermes", ".serena", "build", "dist", "__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F"]
