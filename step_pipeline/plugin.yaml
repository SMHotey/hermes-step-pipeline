name: step_pipeline
version: 0.19.0
description: "Пошаговый конвейер агентов: план → постановка промптером → исполнение → независимое ревью → следующий шаг. Даёт CLI `hermes pipeline`, локальный UI с визуализацией и уведомления в Telegram."
author: malik
license: MIT
kind: backend
platforms:
  - windows
  - linux
  - macos
provides_tools:
  - pipeline_status
  - pipeline_run
  - pipeline_control
provides_hooks:
  - pre_tool_call
optional_env:
  - STEP_PIPELINE_TELEGRAM_BOT_TOKEN
  - STEP_PIPELINE_TELEGRAM_CHAT_ID
  - GITHUB_TOKEN
config_schema:
  telegram_bot_token:
    type: secret
    env: STEP_PIPELINE_TELEGRAM_BOT_TOKEN
    description: "Токен бота от @BotFather для уведомлений конвейера"
  telegram_chat_id:
    type: str
    env: STEP_PIPELINE_TELEGRAM_CHAT_ID
    description: "Куда слать уведомления: chat id или @канал"
  project_root:
    type: str
    description: "Путь к проекту по умолчанию для панели и команд без --project (если пусто — поиск вверх от текущего каталога)"
