name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    # Замер идёт и в дочерних процессах: sitecustomize.py в корне подхватывает конфиг
    # по COVERAGE_PROCESS_START, данные детей сводятся в один абсолютный COVERAGE_FILE.
    env:
      COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Зависимости
        run: python -m pip install --upgrade pip pytest coverage==7.17.0
      - name: Тесты с покрытием (подпроцессы движка тоже меряются)
        run: python -m coverage run --parallel-mode -m pytest
      - name: Свести данные покрытия
        run: python -m coverage combine
      - name: Отчёт покрытия (порог fail_under — из .coveragerc)
        run: python -m coverage report -m
      - name: Гейт покрытия gate.py
        run: python -m coverage report --include="**/step_pipeline/engine/gate.py" --fail-under=55

  # Валидация манифеста — отдельный job: он не зависит от того, есть ли hermes в раннере
  # job tests, и падает, если валидация невозможна, вместо молчаливого «шаг пропущен».
  # Composite action plugin-validate@v2026.9.24 не годится: он ставит hermes через
  # `pip install git+...`, а setup.py в этом теге запрещает сборку колеса/сдиста
  # («Building wheels or sdists for hermes-agent is not supported»). Рабочий поддерживаемый
  # git-путь — editable-установка из копии репозитория; версия та же, что у владельца.
  manifest:
    name: Манифест плагина
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Копия hermes-agent (тег v2026.9.24)
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: v2026.9.24
          path: .hermes-agent
      - name: Установка hermes
        run: python -m pip install -e ./.hermes-agent
      - name: hermes plugins validate step_pipeline
        run: python -m hermes_cli.main plugins validate step_pipeline
